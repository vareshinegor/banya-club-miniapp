<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Панель — Банный Орден</title>
  <link rel="stylesheet" href="{{ versioned_static('admin/admin.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="/static/img/emblem.png" alt="">
        <span>Банный Орден<small>Панель управления</small></span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="whoami" class="whoami"></div>
        <form method="post" action="{{ url_for('admin.logout') }}">
          <button type="submit" class="btn btn-ghost btn-sm">Выйти</button>
        </form>
      </div>
    </aside>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <script src="{{ versioned_static('admin/admin.js') }}"></script>
</body>
</html>
