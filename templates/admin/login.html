<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — Банный Орден</title>
  <link rel="stylesheet" href="{{ versioned_static('admin/admin.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/static/img/emblem-v2.png" alt="" class="login-emblem">
    <h1>Банный Орден</h1>
    <p class="login-sub">Панель управления</p>

    {% if disabled %}
      <p class="login-error">Панель выключена: на сервере не задан пароль администратора (переменная ADMIN_PASSWORD).</p>
    {% else %}
      <form method="post" action="{{ url_for('admin.login') }}" autocomplete="on">
        <label class="field">
          <span>Логин</span>
          <input type="text" name="login" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>Пароль</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
